name: Release Plugin

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Compute plugin version and bump Directory.Build.props
        id: version
        run: |
          # Normalize e.g. v0.2.0 -> 0.2.0.0 (same logic as
          # scripts/update-manifest.py's normalize_version, kept in sync
          # manually since this needs to run before the build, not after).
          # Bumping Directory.Build.props here (not just manifest.json) is
          # required: Plugin.Instance.Version reads the built assembly's own
          # version, and skipping this step means every tagged release
          # keeps shipping 0.1.0.0 regardless of the tag, which would make
          # the plugin's own update-checker perpetually report "update
          # available" even right after installing one.
          TAG="${{ github.ref_name }}"
          IFS='.' read -ra PARTS <<< "${TAG#v}"
          while [ "${#PARTS[@]}" -lt 4 ]; do PARTS+=("0"); done
          VERSION="${PARTS[0]}.${PARTS[1]}.${PARTS[2]}.${PARTS[3]}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          sed -i "s#<Version>[^<]*</Version>#<Version>$VERSION</Version>#" Directory.Build.props
          sed -i "s#<AssemblyVersion>[^<]*</AssemblyVersion>#<AssemblyVersion>$VERSION</AssemblyVersion>#" Directory.Build.props
          sed -i "s#<FileVersion>[^<]*</FileVersion>#<FileVersion>$VERSION</FileVersion>#" Directory.Build.props
          grep -E "Version>" Directory.Build.props

      - name: Restore dependencies
        run: dotnet restore Jellyfin.Plugin.MediaIntegrityScanner/Jellyfin.Plugin.MediaIntegrityScanner.csproj

      - name: Build Release
        run: dotnet publish Jellyfin.Plugin.MediaIntegrityScanner/Jellyfin.Plugin.MediaIntegrityScanner.csproj --configuration Release --output ./publish

      - name: Package
        run: |
          cd publish
          zip -r ../media-integrity-scanner-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: media-integrity-scanner-${{ github.ref_name }}.zip
          generate_release_notes: true

      - name: Update manifest.json
        run: |
          # Retry on a rejected push rather than failing outright -- see the
          # identical comment in release-dev.yml for why (a concurrent release
          # run winning the race is unlikely here since stable releases are
          # human-triggered one at a time, but not impossible, and the fix is
          # the same either way). A reset --hard also wipes the earlier step's
          # uncommitted Directory.Build.props edit, so it's redone here too on
          # every attempt using the same already-computed version string --
          # deterministic and safe to repeat.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            sed -i "s#<Version>[^<]*</Version>#<Version>${{ steps.version.outputs.version }}</Version>#" Directory.Build.props
            sed -i "s#<AssemblyVersion>[^<]*</AssemblyVersion>#<AssemblyVersion>${{ steps.version.outputs.version }}</AssemblyVersion>#" Directory.Build.props
            sed -i "s#<FileVersion>[^<]*</FileVersion>#<FileVersion>${{ steps.version.outputs.version }}</FileVersion>#" Directory.Build.props

            python3 scripts/update-manifest.py "${{ github.ref_name }}" "media-integrity-scanner-${{ github.ref_name }}.zip" \
              --manifest-version "${{ steps.version.outputs.version }}"
            git add manifest.json Directory.Build.props
            git commit -m "chore: release ${{ github.ref_name }} (manifest.json + Directory.Build.props)"

            # Assumes the tag was created from the current tip of main.
            if git push origin HEAD:main; then
              echo "Pushed manifest.json update on attempt $attempt"
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "::error::Failed to push manifest.json update after 5 attempts"
              exit 1
            fi

            echo "Push rejected on attempt $attempt (likely a concurrent release run) -- retrying against latest main"
            git fetch origin main
            git reset --hard origin/main
            sleep $((RANDOM % 5 + 1))
          done
