name: Integration Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Build plugin
        run: |
          dotnet restore Jellyfin.Plugin.MediaIntegrityScanner/Jellyfin.Plugin.MediaIntegrityScanner.csproj
          dotnet publish Jellyfin.Plugin.MediaIntegrityScanner/Jellyfin.Plugin.MediaIntegrityScanner.csproj --configuration Release --output ./publish

      - name: List build output
        run: ls -la ./publish/

      - name: Create Jellyfin directories
        run: |
          mkdir -p jellyfin-config/plugins/MediaIntegrityScanner
          mkdir -p jellyfin-cache
          mkdir -p test-media

      - name: Install plugin into Jellyfin config
        run: |
          cp ./publish/Jellyfin.Plugin.MediaIntegrityScanner.dll \
             jellyfin-config/plugins/MediaIntegrityScanner/
          cp ./publish/Microsoft.Data.Sqlite.dll \
             jellyfin-config/plugins/MediaIntegrityScanner/ 2>/dev/null || true
          cp ./publish/SQLitePCLRaw.*.dll \
             jellyfin-config/plugins/MediaIntegrityScanner/ 2>/dev/null || true
          echo "Plugin files installed:"
          ls -la jellyfin-config/plugins/MediaIntegrityScanner/

      - name: Create test media file
        run: |
          # Generate a small valid test video using ffmpeg
          sudo apt-get update && sudo apt-get install -y ffmpeg
          ffmpeg -f lavfi -i testsrc=duration=5:size=320x240:rate=25 \
                 -f lavfi -i sine=frequency=440:duration=5 \
                 -c:v libx264 -c:a aac -shortest \
                 test-media/test-video.mp4
          echo "Test media created:"
          ls -la test-media/

      - name: Start Jellyfin container
        run: |
          docker run -d \
            --name jellyfin-test \
            -p 8096:8096 \
            -v ${{ github.workspace }}/jellyfin-config:/config \
            -v ${{ github.workspace }}/jellyfin-cache:/cache \
            -v ${{ github.workspace }}/test-media:/media \
            -e JELLYFIN_LOG_LEVEL=Information \
            jellyfin/jellyfin:10.11.11
          echo "Jellyfin container started"

      - name: Wait for Jellyfin to be fully ready
        run: |
          echo "Waiting for Jellyfin health check..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8096/health > /dev/null 2>&1; then
              echo "Health check passed after ${i} seconds"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "ERROR: Jellyfin failed to start within 60 seconds"
              docker logs jellyfin-test
              exit 1
            fi
            sleep 1
          done

          # Health check passes before initialization completes.
          # Wait for the startup wizard API to become available.
          echo "Waiting for startup wizard API..."
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8096/Startup/Configuration || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Startup wizard API ready after ${i} additional seconds"
              break
            fi
            echo "  Attempt ${i}: HTTP $HTTP_CODE (waiting...)"
            if [ "$i" -eq 60 ]; then
              echo "ERROR: Startup wizard API not available after 60 seconds (last HTTP code: $HTTP_CODE)"
              docker logs jellyfin-test 2>&1 | tail -30
              exit 1
            fi
            sleep 1
          done

      - name: Complete Jellyfin initial setup
        run: |
          # Complete the startup wizard via API
          # Step 1: Set startup configuration (language/metadata)
          echo "Setting startup configuration..."
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST http://localhost:8096/Startup/Configuration \
            -H "Content-Type: application/json" \
            -d '{
              "UICulture": "en-US",
              "MetadataCountryCode": "US",
              "PreferredMetadataLanguage": "en"
            }' || true)
          echo "  Configuration response: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "  Response body: $(cat /tmp/response.txt)"
            exit 1
          fi

          # Step 2: Initialize and update admin user
          # GET /Startup/User triggers user initialization in 10.11+
          echo "Initializing default user..."
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            http://localhost:8096/Startup/User || true)
          echo "  Get user response: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "  WARNING: GET /Startup/User returned $HTTP_CODE (response: $(cat /tmp/response.txt 2>/dev/null))"
          fi

          echo "Setting admin username and password..."
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST http://localhost:8096/Startup/User \
            -H "Content-Type: application/json" \
            -d '{
              "Name": "testadmin",
              "Password": "testpassword123"
            }' || true)
          echo "  User creation response: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "  Response body: $(cat /tmp/response.txt)"
            exit 1
          fi

          # Step 3: Set remote access (required by 10.11 wizard)
          echo "Setting remote access..."
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST http://localhost:8096/Startup/RemoteAccess \
            -H "Content-Type: application/json" \
            -d '{
              "EnableRemoteAccess": true,
              "EnableAutomaticPortMapping": false
            }' || true)
          echo "  Remote access response: HTTP $HTTP_CODE"
          # RemoteAccess may not exist on all versions, don't fail
          if [ "$HTTP_CODE" -ge 500 ]; then
            echo "  Response body: $(cat /tmp/response.txt)"
            exit 1
          fi

          # Step 4: Complete the wizard
          echo "Completing wizard..."
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST http://localhost:8096/Startup/Complete || true)
          echo "  Complete response: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "  Response body: $(cat /tmp/response.txt)"
            exit 1
          fi

          echo "Startup wizard completed successfully"

          # Give Jellyfin a moment to restart/reconfigure after wizard completion
          sleep 3

      - name: Authenticate and get API key
        id: auth
        run: |
          # Authenticate to get an access token
          echo "Authenticating as testadmin..."
          AUTH_RESPONSE=$(curl -s -X POST http://localhost:8096/Users/AuthenticateByName \
            -H "Content-Type: application/json" \
            -H "X-Emby-Authorization: MediaBrowser Client=\"Integration Test\", Device=\"GitHub Actions\", DeviceId=\"gh-actions-runner\", Version=\"1.0.0\"" \
            -d '{
              "Username": "testadmin",
              "Pw": "testpassword123"
            }')

          TOKEN=$(echo "$AUTH_RESPONSE" | jq -r '.AccessToken')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: Failed to get access token"
            echo "Response: $AUTH_RESPONSE"
            exit 1
          fi

          echo "api_token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "Successfully authenticated"

      - name: Verify plugin is loaded
        run: |
          TOKEN="${{ steps.auth.outputs.api_token }}"

          # Get list of installed plugins
          PLUGINS=$(curl -sf http://localhost:8096/Plugins \
            -H "X-Emby-Token: $TOKEN")

          echo "Installed plugins:"
          echo "$PLUGINS" | jq '.[].Name'

          # Check our plugin is present
          PLUGIN_FOUND=$(echo "$PLUGINS" | jq '[.[] | select(.Id == "c8f4a3b21d5e4f6a9b7c2e8d0f1a3b5c")] | length')

          if [ "$PLUGIN_FOUND" -eq 0 ]; then
            echo "ERROR: Media Integrity Scanner plugin not found in loaded plugins"
            echo "Full plugin list:"
            echo "$PLUGINS" | jq .
            docker logs jellyfin-test 2>&1 | grep -i -A5 "integrity\|plugin\|error" || true
            exit 1
          fi

          echo "SUCCESS: Media Integrity Scanner plugin is loaded"
          echo "$PLUGINS" | jq '.[] | select(.Id == "c8f4a3b21d5e4f6a9b7c2e8d0f1a3b5c")'

      - name: Verify plugin configuration endpoint
        run: |
          TOKEN="${{ steps.auth.outputs.api_token }}"

          # Get plugin configuration
          CONFIG=$(curl -sf http://localhost:8096/Plugins/c8f4a3b21d5e4f6a9b7c2e8d0f1a3b5c/Configuration \
            -H "X-Emby-Token: $TOKEN") || true

          if [ -n "$CONFIG" ]; then
            echo "Plugin configuration accessible:"
            echo "$CONFIG" | jq .
          else
            echo "WARNING: Plugin configuration endpoint not available (may be expected for scaffold)"
          fi

      - name: Verify FFmpeg is available in container
        run: |
          set -euo pipefail
          echo "Checking FFmpeg availability inside Jellyfin container..."
          # jellyfin-ffmpeg is not symlinked onto PATH in the jellyfin/jellyfin
          # image, so a bare `ffmpeg`/`ffprobe` exec always fails. This step
          # previously piped into `head -5` without pipefail, which masked
          # that failure (head's own exit code is 0) and let this pass
          # silently for a long time without actually verifying anything.
          docker exec jellyfin-test /usr/lib/jellyfin-ffmpeg/ffmpeg -version | head -5
          docker exec jellyfin-test /usr/lib/jellyfin-ffmpeg/ffprobe -version | head -5
          echo "FFmpeg is available"

      - name: Verify settings page configuration round-trip
        run: |
          set -euo pipefail
          TOKEN="${{ steps.auth.outputs.api_token }}"
          PLUGIN_GUID="c8f4a3b21d5e4f6a9b7c2e8d0f1a3b5c"

          ORIGINAL_CONFIG=$(curl -sf "http://localhost:8096/Plugins/$PLUGIN_GUID/Configuration" -H "X-Emby-Token: $TOKEN")

          UPDATED_CONFIG='{
            "MaxConcurrentScans": 3,
            "DelayBetweenFilesMs": 1234,
            "PauseDuringPlayback": false,
            "EnableDeepScan": true,
            "MaxReadRateMbPerSec": 7,
            "UseQuietHoursOnly": true,
            "QuietHoursStart": "23:00",
            "QuietHoursEnd": "05:30",
            "FfmpegPathOverride": "/custom/ffmpeg",
            "FfprobePathOverride": "/custom/ffprobe",
            "ScanOnItemAdded": false,
            "PurgeOnItemRemoved": false
          }'

          echo "Saving updated configuration (simulating the settings page Save button)..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:8096/Plugins/$PLUGIN_GUID/Configuration" \
            -H "X-Emby-Token: $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$UPDATED_CONFIG")
          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "ERROR: Settings save failed with HTTP $HTTP_CODE"
            exit 1
          fi

          SAVED_CONFIG=$(curl -sf "http://localhost:8096/Plugins/$PLUGIN_GUID/Configuration" -H "X-Emby-Token: $TOKEN")
          SAVED_MAX_CONCURRENT=$(echo "$SAVED_CONFIG" | jq '.MaxConcurrentScans')
          SAVED_QUIET_START=$(echo "$SAVED_CONFIG" | jq -r '.QuietHoursStart')
          SAVED_FFMPEG_OVERRIDE=$(echo "$SAVED_CONFIG" | jq -r '.FfmpegPathOverride')

          if [ "$SAVED_MAX_CONCURRENT" = "3" ] && [ "$SAVED_QUIET_START" = "23:00" ] && [ "$SAVED_FFMPEG_OVERRIDE" = "/custom/ffmpeg" ]; then
            echo "SUCCESS: configuration saved and persisted correctly"
          else
            echo "ERROR: saved configuration did not round-trip correctly: $SAVED_CONFIG"
            exit 1
          fi

          echo "Restoring original configuration..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:8096/Plugins/$PLUGIN_GUID/Configuration" \
            -H "X-Emby-Token: $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$ORIGINAL_CONFIG")
          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "ERROR: failed to restore original configuration (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Original configuration restored"

      - name: Verify plugin web pages are served
        run: |
          set -euo pipefail
          TOKEN="${{ steps.auth.outputs.api_token }}"

          DASHBOARD_CODE=$(curl -s -o /tmp/dashboard_page.html -w "%{http_code}" \
            "http://localhost:8096/web/configurationpage?name=Media+Integrity+Scanner" -H "X-Emby-Token: $TOKEN")
          SETTINGS_CODE=$(curl -s -o /tmp/settings_page.html -w "%{http_code}" \
            "http://localhost:8096/web/configurationpage?name=Media+Integrity+Scanner+Settings" -H "X-Emby-Token: $TOKEN")

          if [ "$DASHBOARD_CODE" = "200" ] && grep -q "MediaIntegrity" /tmp/dashboard_page.html; then
            echo "SUCCESS: dashboard page served (HTTP $DASHBOARD_CODE)"
          else
            echo "ERROR: dashboard page not served correctly (HTTP $DASHBOARD_CODE)"
            exit 1
          fi

          if [ "$SETTINGS_CODE" = "200" ] && grep -q "getPluginConfiguration" /tmp/settings_page.html; then
            echo "SUCCESS: settings page served (HTTP $SETTINGS_CODE)"
          else
            echo "ERROR: settings page not served correctly (HTTP $SETTINGS_CODE)"
            exit 1
          fi

      - name: Add test media library
        run: |
          TOKEN="${{ steps.auth.outputs.api_token }}"

          # Create a media library pointing to our test media
          curl -sf -X POST "http://localhost:8096/Library/VirtualFolders?name=TestMovies&collectionType=movies&refreshLibrary=true" \
            -H "X-Emby-Token: $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "LibraryOptions": {
                "PathInfos": [{"Path": "/media"}],
                "EnableRealtimeMonitor": false
              }
            }'

          echo "Test library created, waiting for scan..."

          # Poll for library items instead of fixed sleep
          for i in $(seq 1 30); do
            ITEMS=$(curl -sf "http://localhost:8096/Items?Recursive=true" \
              -H "X-Emby-Token: $TOKEN")
            ITEM_COUNT=$(echo "$ITEMS" | jq '.TotalRecordCount')
            if [ "$ITEM_COUNT" -gt 0 ]; then
              echo "Library items found: $ITEM_COUNT (after ${i} seconds)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "WARNING: No library items detected after 30 seconds (metadata fetch may be slow)"
            fi
            sleep 1
          done

      - name: Trigger scan and verify results
        run: |
          set -euo pipefail
          TOKEN="${{ steps.auth.outputs.api_token }}"

          echo "Triggering a header scan of the library..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:8096/MediaIntegrity/Scan" \
            -H "X-Emby-Token: $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"deepScan": false}')
          if [ "$HTTP_CODE" != "202" ]; then
            echo "ERROR: triggering scan failed with HTTP $HTTP_CODE (expected 202 Accepted)"
            exit 1
          fi
          echo "Scan triggered (HTTP 202)"

          echo "Waiting for scan to complete..."
          for i in $(seq 1 60); do
            STATUS=$(curl -sf "http://localhost:8096/MediaIntegrity/Status" -H "X-Emby-Token: $TOKEN")
            # Note: Jellyfin's host serializes controller responses in
            # PascalCase (not the ASP.NET Core camelCase default) -- the
            # dashboard's JS needed the same fix, see CODE_REVIEW.md.
            IS_SCANNING=$(echo "$STATUS" | jq -r '.IsScanning')
            if [ "$IS_SCANNING" = "false" ]; then
              echo "Scan completed (after ${i} seconds)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "ERROR: scan did not complete within 60 seconds. Last status: $STATUS"
              exit 1
            fi
            sleep 1
          done

          echo "Verifying scan results..."
          FINAL_STATUS=$(curl -sf "http://localhost:8096/MediaIntegrity/Status" -H "X-Emby-Token: $TOKEN")
          SCANNED_FILES=$(echo "$FINAL_STATUS" | jq '.ScannedFiles')
          PASSED_FILES=$(echo "$FINAL_STATUS" | jq '.PassedFiles')

          if [ "$SCANNED_FILES" -lt 1 ]; then
            echo "ERROR: expected at least 1 scanned file, got $SCANNED_FILES. Status: $FINAL_STATUS"
            exit 1
          fi
          echo "SUCCESS: library health reflects the scan: $SCANNED_FILES scanned, $PASSED_FILES passed"

          RESULTS=$(curl -sf "http://localhost:8096/MediaIntegrity/Results?status=1" -H "X-Emby-Token: $TOKEN")
          RESULT_COUNT=$(echo "$RESULTS" | jq '.TotalCount')

          if [ "$RESULT_COUNT" -lt 1 ]; then
            echo "ERROR: expected at least 1 passed scan result via GET /MediaIntegrity/Results?status=1, got $RESULT_COUNT"
            exit 1
          fi
          echo "SUCCESS: GET /MediaIntegrity/Results?status=1 returns $RESULT_COUNT passed result(s)"
          echo "$RESULTS" | jq '.Items[0] | {FilePath, ScanStatus, ScanPhase, ScanDurationMs}'

      - name: Collect Jellyfin logs on failure
        if: failure()
        run: |
          echo "=== Jellyfin Container Logs ==="
          docker logs jellyfin-test 2>&1 | tail -100
          echo ""
          echo "=== Plugin Directory Contents ==="
          docker exec jellyfin-test ls -la /config/plugins/MediaIntegrityScanner/ 2>/dev/null || echo "Plugin directory not found"
          echo ""
          echo "=== Jellyfin Log File ==="
          docker exec jellyfin-test cat /config/log/log_*.log 2>/dev/null | tail -50 || echo "No log file found"

      - name: Cleanup
        if: always()
        run: |
          docker stop jellyfin-test 2>/dev/null || true
          docker rm jellyfin-test 2>/dev/null || true
