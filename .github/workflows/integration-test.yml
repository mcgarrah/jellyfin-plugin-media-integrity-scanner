name: Integration Test

# ubuntu-latest only, deliberately: this suite runs a real Jellyfin server via
# Docker Compose, which windows-latest/macos-latest either lack a usable
# daemon for or would behave too differently on (Windows containers vs. Linux
# containers) to just retarget the same compose file. Cross-platform coverage
# lives in build.yml's dotnet-test matrix instead, which has no such
# dependency -- see that file's comment for the full scoping rationale.
#
# Matrixed across both multi-targeted builds and their real Jellyfin server
# lines (net9.0/10.11.11, net10.0/12.0) -- confirming the plugin actually
# works against both, not just that it compiles against both (build.yml's
# dotnet-test only proves the latter, with mocked interfaces).
#
# Delegates to tests/setup-jellyfin.sh (sourced by run-integration-tests.sh)
# instead of reimplementing the startup-wizard/auth/library-setup sequence
# inline in YAML -- this workflow used to carry its own ~500-line duplicate
# of that sequence, which had silently drifted out of sync with the shared
# script (still using the pre-12.0 X-Emby-Authorization/X-Emby-Token headers
# after the shared script was already fixed). One implementation, used by
# this workflow, the Playwright suite, and local dev alike.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_framework: net9.0
            jellyfin_image: jellyfin/jellyfin:10.11.11
          - target_framework: net10.0
            jellyfin_image: jellyfin/jellyfin:12.0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 9 and .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Build plugin (${{ matrix.target_framework }})
        run: |
          dotnet restore Jellyfin.Plugin.MediaIntegrityScanner/Jellyfin.Plugin.MediaIntegrityScanner.csproj
          dotnet publish Jellyfin.Plugin.MediaIntegrityScanner/Jellyfin.Plugin.MediaIntegrityScanner.csproj --configuration Release --framework ${{ matrix.target_framework }} --output ./publish

      - name: List build output
        run: ls -la ./publish/

      - name: Create test media file
        run: |
          # Generates the full good/bad corruption matrix (see
          # tests/generate-test-media.sh's header comment for the verified
          # pass/fail table per file). Falls back to apt's vanilla ffmpeg
          # since /usr/lib/jellyfin-ffmpeg isn't present on the runner itself
          # (only inside the Jellyfin container started below).
          sudo apt-get update && sudo apt-get install -y ffmpeg
          bash tests/generate-test-media.sh tests/test-media
          echo "Test media created:"
          ls -la tests/test-media/

      - name: Pre-create plugin directory with correct ownership
        # Must happen before the container ever starts: if
        # tests/jellyfin-config doesn't exist yet when `docker compose up`
        # runs, Docker creates the bind-mount target as root, and every
        # subsequent non-root mkdir/cp into it (including the ones
        # setup-jellyfin.sh does on its own) fails with Permission denied.
        # Pre-creating and populating it here as the runner user avoids that
        # entirely -- confirmed by hitting this exact failure locally when
        # testing this workflow before adding this step.
        run: |
          mkdir -p tests/jellyfin-config/plugins/MediaIntegrityScanner
          mkdir -p tests/jellyfin-cache
          cp ./publish/Jellyfin.Plugin.MediaIntegrityScanner.dll tests/jellyfin-config/plugins/MediaIntegrityScanner/
          cp ./publish/Microsoft.Data.Sqlite.dll tests/jellyfin-config/plugins/MediaIntegrityScanner/ 2>/dev/null || true
          cp ./publish/SQLitePCLRaw.*.dll tests/jellyfin-config/plugins/MediaIntegrityScanner/ 2>/dev/null || true
          cp ./publish/meta.json tests/jellyfin-config/plugins/MediaIntegrityScanner/ 2>/dev/null || true

      - name: Start Jellyfin container (${{ matrix.jellyfin_image }})
        env:
          JELLYFIN_IMAGE: ${{ matrix.jellyfin_image }}
        run: docker compose -f tests/docker-compose.integration.yml up -d

      - name: Run integration tests
        run: bash tests/run-integration-tests.sh

      - name: Collect Jellyfin logs on failure
        if: failure()
        run: |
          echo "=== Jellyfin Container Logs ==="
          docker logs jellyfin-integration-test 2>&1 | tail -150
          echo ""
          echo "=== Plugin Directory Contents ==="
          docker exec jellyfin-integration-test ls -la /config/plugins/MediaIntegrityScanner/ 2>/dev/null || echo "Plugin directory not found"

      - name: Cleanup
        if: always()
        run: docker compose -f tests/docker-compose.integration.yml down -v
