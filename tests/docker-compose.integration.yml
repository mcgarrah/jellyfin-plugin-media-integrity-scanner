# Docker Compose for local integration testing
# Usage:
#   1. Build the plugin: dotnet publish --configuration Release --framework net9.0|net10.0 --output ./publish
#      (the project multi-targets net9.0/Jellyfin 10.11 and net10.0/Jellyfin 12.0 --
#      --framework must match whichever JELLYFIN_IMAGE line below you're testing)
#   2. Create test media: ffmpeg -f lavfi -i testsrc=duration=5:size=320x240:rate=25 \
#        -f lavfi -i sine=frequency=440:duration=5 -c:v libx264 -c:a aac \
#        -shortest tests/test-media/test-video.mp4
#   3. Start: JELLYFIN_IMAGE=jellyfin/jellyfin:12.0 docker compose -f tests/docker-compose.integration.yml up -d
#      (defaults to :12.0 if JELLYFIN_IMAGE is unset -- use :10.11.11 to test the other target)
#   4. Run tests: ./tests/run-integration-tests.sh
#   5. Teardown: docker compose -f tests/docker-compose.integration.yml down -v
#
# restart: unless-stopped means a manually-started instance (e.g. a demo box
# kept running on an LXC to browse the plugin) survives a host reboot as
# long as Docker itself starts on boot -- it has no effect on CI or the
# local test scripts' own explicit `down -v` teardown.

services:
  jellyfin:
    image: ${JELLYFIN_IMAGE:-jellyfin/jellyfin:12.0}
    container_name: jellyfin-integration-test
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - ./jellyfin-config:/config
      - ./jellyfin-cache:/cache
      - ./test-media:/media
    environment:
      - JELLYFIN_LOG_LEVEL=Information
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
