<!--
  Media Integrity Scanner plugin icon — source of truth.
  1920x1080, matching the actual convention used across the Jellyfin
  catalog (checked against jellyfin-plugin-playbackreporting.png,
  jellyfin-plugin-nextpvr.png, jellyfin-plugin-ldapauth.png at
  repo.jellyfin.org): a radial-glow flat background, a simple left-aligned
  glyph, and the plugin name as a bold wordmark to its right, not a
  square app-icon-style badge.

  Concept: a play glyph with a verified checkmark badge, ink-teal / warm-gold
  palette (deliberately not the generic dark+neon-accent look).

  To regenerate the PNG used in the manifests after editing this file:
    rsvg-convert -w 1920 -h 1080 assets/icon.svg -o assets/icon.png
  (requires librsvg2-bin: apt-get install librsvg2-bin)

  If you change this icon, the PNG must be re-committed too — manifest.json
  and manifest-unstable.json both reference the PNG's raw GitHub URL
  directly, not the SVG.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <title>Media Integrity Scanner</title>

  <defs>
    <radialGradient id="bgGlow" cx="18%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#173D40"/>
      <stop offset="100%" stop-color="#0E2A2C"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#bgGlow)"/>

  <!-- Play glyph -->
  <path d="M 140 400 L 140 680 L 380 540 Z" fill="#F2EFE9"/>

  <!-- Verified badge: keyline cutout, then gold disc, then checkmark -->
  <circle cx="410" cy="660" r="110" fill="#0E2A2C"/>
  <circle cx="410" cy="660" r="96" fill="#D9A441"/>
  <path d="M 370 665 L 398 693 L 455 615" fill="none"
        stroke="#0E2A2C" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="560" y="500" font-family="DejaVu Sans, sans-serif" font-weight="bold"
        font-size="124" fill="#F2EFE9">Media Integrity</text>
  <text x="560" y="652" font-family="DejaVu Sans, sans-serif" font-weight="bold"
        font-size="124" fill="#F2EFE9">Scanner</text>
</svg>
