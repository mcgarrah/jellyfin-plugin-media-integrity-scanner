<div id="MediaIntegrityScannerPage" data-role="page" class="page type-interior pluginConfigurationPage">
    <div data-role="content" class="content-primary">
        <style>
            .integrity-dashboard { padding: 4em 2em 1em; font-family: inherit; }
            .stats-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                gap: 1em;
                margin: 1.5em 0;
            }
            .stat-card {
                background: rgba(255,255,255,0.05);
                border-radius: 8px;
                padding: 1.2em;
                text-align: center;
            }
            .stat-value { font-size: 2em; font-weight: bold; margin: 0.2em 0; }
            .stat-label { opacity: 0.7; font-size: 0.9em; }
            .status-pass { color: #4caf50; }
            .status-fail { color: #f44336; }
            .status-pending { color: #ff9800; }
            .status-scanning { color: #2196f3; }
            .health-bar {
                height: 8px;
                background: rgba(255,255,255,0.1);
                border-radius: 4px;
                overflow: hidden;
                margin: 1em 0;
            }
            .health-bar-fill {
                height: 100%;
                border-radius: 4px;
                transition: width 0.5s ease;
            }
            .btn {
                padding: 0.5em 1.2em;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 0.9em;
                margin-right: 0.5em;
            }
            .btn-primary { background: #00a4dc; color: white; }
            .btn-danger { background: #f44336; color: white; }
            .btn:disabled { opacity: 0.5; cursor: not-allowed; }
            .controls { margin: 1em 0; display: flex; gap: 0.5em; align-items: center; flex-wrap: wrap; }
            .results-table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 1em;
            }
            .results-table th,
            .results-table td {
                padding: 0.6em 1em;
                text-align: left;
                border-bottom: 1px solid rgba(255,255,255,0.1);
            }
            .results-table th { opacity: 0.7; font-weight: 600; }
            .filter-row { display: flex; gap: 1em; margin: 1em 0; align-items: center; }
            .pagination { display: flex; gap: 0.5em; margin-top: 1em; align-items: center; }
            .error-msg { color: #f44336; font-style: italic; margin: 1em 0; }
            .loading { opacity: 0.5; font-style: italic; }
            .nav-link { float: right; }
            .version-line { opacity: 0.6; font-size: 0.85em; margin: 0.2em 0 1em; }
            .update-banner {
                display: none;
                align-items: center;
                justify-content: space-between;
                gap: 1em;
                background: rgba(0,164,220,0.12);
                border: 1px solid rgba(0,164,220,0.4);
                border-radius: 8px;
                padding: 0.8em 1.2em;
                margin: 1em 0;
            }
            .modal-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.6);
                z-index: 1000;
                align-items: center;
                justify-content: center;
            }
            .modal-overlay.open { display: flex; }
            .modal-box {
                background: #1c1c1c;
                border-radius: 8px;
                padding: 1.5em 2em;
                max-width: 700px;
                width: 90%;
                max-height: 80vh;
                overflow-y: auto;
            }
            .modal-box h2 { margin-top: 0; }
            .modal-field { margin-bottom: 1em; }
            .modal-field-label { opacity: 0.7; font-size: 0.85em; margin-bottom: 0.2em; }
            .modal-field-value { word-break: break-word; white-space: pre-wrap; }
            .modal-close { float: right; }
            .results-table tbody tr { cursor: pointer; }
            .results-table tbody tr:hover { background: rgba(255,255,255,0.05); }
        </style>

        <div class="integrity-dashboard">
            <a class="nav-link" href="#/configurationpage?name=Media+Integrity+Scanner+Settings">Settings &raquo;</a>
            <h1>Media Integrity Scanner</h1>
            <div class="version-line">Version <span id="current-version">&mdash;</span></div>

            <div id="update-banner" class="update-banner">
                <span id="update-banner-text"></span>
                <button class="btn btn-primary" id="btn-update-now" onclick="installUpdate()">Update Now</button>
            </div>

            <!-- Status Overview -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Library Health</div>
                    <div class="stat-value status-pass" id="health-pct">&mdash;</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Files</div>
                    <div class="stat-value" id="total-files">&mdash;</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Passed</div>
                    <div class="stat-value status-pass" id="passed-files">&mdash;</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Failed</div>
                    <div class="stat-value status-fail" id="failed-files">&mdash;</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Errored</div>
                    <div class="stat-value status-fail" id="errored-files">&mdash;</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Pending</div>
                    <div class="stat-value status-pending" id="pending-files">&mdash;</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Status</div>
                    <div class="stat-value status-scanning" id="scan-status">Idle</div>
                </div>
            </div>

            <div class="health-bar">
                <div class="health-bar-fill" id="health-bar"
                     style="width: 0%; background: #4caf50;"></div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="btn btn-primary" id="btn-scan-headers" onclick="triggerScan(false)">
                    Run Header Scan
                </button>
                <button class="btn btn-primary" id="btn-scan-deep" onclick="triggerScan(true)">
                    Run Deep Scan
                </button>
                <button class="btn btn-danger" id="btn-cancel" onclick="cancelScan()" disabled>
                    Cancel Scan
                </button>
                <button class="btn btn-primary" id="btn-refresh-list" onclick="loadResults()">
                    Refresh File List
                </button>
                <select id="filter-status" onchange="loadResults()">
                    <option value="">All Results</option>
                    <option value="2">Failed Only</option>
                    <option value="1">Passed Only</option>
                    <option value="3">Errors Only</option>
                </select>
                <select id="page-size-select" onchange="changePageSize()">
                    <option value="25">25 / page</option>
                    <option value="50" selected>50 / page</option>
                    <option value="100">100 / page</option>
                    <option value="250">250 / page</option>
                </select>
            </div>

            <!-- Error display -->
            <div id="error-msg" class="error-msg" style="display:none;"></div>

            <!-- Results Table -->
            <table class="results-table">
                <thead>
                    <tr>
                        <th>File</th>
                        <th>Status</th>
                        <th>Phase</th>
                        <th>Last Scanned</th>
                        <th>Duration</th>
                        <th>Error</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    <tr><td colspan="6" class="loading">Loading...</td></tr>
                </tbody>
            </table>

            <!-- Pagination -->
            <div class="pagination" id="pagination"></div>

            <!-- Result Detail Modal -->
            <div class="modal-overlay" id="detail-modal-overlay" onclick="if (event.target === this) closeDetail();">
                <div class="modal-box">
                    <button class="btn btn-primary modal-close" onclick="closeDetail()">Close</button>
                    <h2>Scan Result Detail</h2>
                    <div class="modal-field">
                        <div class="modal-field-label">File Path</div>
                        <div class="modal-field-value" id="detail-filepath"></div>
                    </div>
                    <div class="modal-field">
                        <div class="modal-field-label">Status</div>
                        <div class="modal-field-value" id="detail-status"></div>
                    </div>
                    <div class="modal-field">
                        <div class="modal-field-label">Phase</div>
                        <div class="modal-field-value" id="detail-phase"></div>
                    </div>
                    <div class="modal-field">
                        <div class="modal-field-label">Last Scanned</div>
                        <div class="modal-field-value" id="detail-timestamp"></div>
                    </div>
                    <div class="modal-field">
                        <div class="modal-field-label">Duration</div>
                        <div class="modal-field-value" id="detail-duration"></div>
                    </div>
                    <div class="modal-field">
                        <div class="modal-field-label">Full Error / Output</div>
                        <div class="modal-field-value" id="detail-error"></div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // Jellyfin's ApiClient handles authentication automatically within plugin pages
            var currentPage = 1;
            var pageSize = 50;
            var refreshInterval = null;
            var currentResults = [];

            function getApiUrl(path) {
                return ApiClient.getUrl('MediaIntegrity/' + path);
            }

            function apiFetch(path, options) {
                var url = getApiUrl(path);
                var opts = Object.assign({
                    headers: {
                        'X-Emby-Token': ApiClient.accessToken()
                    }
                }, options || {});
                return fetch(url, opts).then(function(resp) {
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    return resp.json();
                });
            }

            function loadStatus() {
                apiFetch('Status').then(function(data) {
                    document.getElementById('health-pct').textContent =
                        data.HealthPercentage + '%';
                    document.getElementById('total-files').textContent =
                        data.TotalFiles;
                    document.getElementById('passed-files').textContent =
                        data.PassedFiles;
                    document.getElementById('failed-files').textContent =
                        data.FailedFiles;
                    document.getElementById('errored-files').textContent =
                        data.ErroredFiles;
                    document.getElementById('pending-files').textContent =
                        data.PendingFiles;
                    document.getElementById('scan-status').textContent =
                        data.IsScanning ? 'Scanning...' : 'Idle';
                    document.getElementById('health-bar').style.width =
                        data.HealthPercentage + '%';

                    // Update button states
                    document.getElementById('btn-cancel').disabled = !data.IsScanning;
                    document.getElementById('btn-scan-headers').disabled = data.IsScanning;
                    document.getElementById('btn-scan-deep').disabled = data.IsScanning;

                    // Color the health bar based on percentage
                    var bar = document.getElementById('health-bar');
                    if (data.HealthPercentage >= 95) {
                        bar.style.background = '#4caf50';
                    } else if (data.HealthPercentage >= 80) {
                        bar.style.background = '#ff9800';
                    } else {
                        bar.style.background = '#f44336';
                    }

                    hideError();
                }).catch(function(err) {
                    showError('Failed to load status: ' + err.message);
                });
            }

            function loadResults() {
                var status = document.getElementById('filter-status').value;
                var params = 'Results?page=' + currentPage + '&pageSize=' + pageSize;
                if (status) params += '&status=' + status;

                apiFetch(params).then(function(data) {
                    renderResults(data);
                    renderPagination(data);
                    hideError();
                }).catch(function(err) {
                    showError('Failed to load results: ' + err.message);
                });
            }

            function renderResults(data) {
                var tbody = document.getElementById('results-body');
                currentResults = data.Items || [];
                if (currentResults.length === 0) {
                    tbody.innerHTML =
                        '<tr><td colspan="6">No results yet. Run a scan to begin.</td></tr>';
                    return;
                }

                tbody.innerHTML = currentResults.map(function(item, index) {
                    var filename = item.FilePath ? item.FilePath.split('/').pop().split('\\').pop() : '—';
                    var statusClass = getStatusClass(item.ScanStatus);
                    var statusLabel = getStatusLabel(item.ScanStatus);
                    var phaseLabel = item.ScanPhase === 1 ? 'Header' : 'Full Decode';
                    var timestamp = formatDate(item.ScanTimestamp);
                    var duration = item.ScanDurationMs ? (item.ScanDurationMs / 1000).toFixed(1) + 's' : '—';
                    var error = item.ErrorOutput
                        ? '<span title="' + escapeHtml(item.ErrorOutput) + '">' +
                          escapeHtml(item.ErrorOutput.substring(0, 50)) + '...</span>'
                        : '—';

                    return '<tr onclick="showDetail(' + index + ')">' +
                        '<td title="' + escapeHtml(item.FilePath || '') + '">' + escapeHtml(filename) + '</td>' +
                        '<td class="status-' + statusClass + '">' + statusLabel + '</td>' +
                        '<td>' + phaseLabel + '</td>' +
                        '<td>' + timestamp + '</td>' +
                        '<td>' + duration + '</td>' +
                        '<td>' + error + '</td>' +
                        '</tr>';
                }).join('');
            }

            function showDetail(index) {
                var item = currentResults[index];
                if (!item) return;

                document.getElementById('detail-filepath').textContent = item.FilePath || '—';
                document.getElementById('detail-status').textContent = getStatusLabel(item.ScanStatus);
                document.getElementById('detail-phase').textContent =
                    item.ScanPhase === 1 ? 'Header' : 'Full Decode';
                document.getElementById('detail-timestamp').textContent = formatDate(item.ScanTimestamp);
                document.getElementById('detail-duration').textContent =
                    item.ScanDurationMs ? (item.ScanDurationMs / 1000).toFixed(1) + 's' : '—';
                document.getElementById('detail-error').textContent = item.ErrorOutput || '—';

                document.getElementById('detail-modal-overlay').classList.add('open');
            }

            function closeDetail() {
                document.getElementById('detail-modal-overlay').classList.remove('open');
            }

            function renderPagination(data) {
                var totalPages = Math.ceil(data.TotalCount / pageSize);
                var container = document.getElementById('pagination');

                if (totalPages <= 1) {
                    container.innerHTML = '';
                    return;
                }

                var html = '';
                if (currentPage > 1) {
                    html += '<button class="btn btn-primary" onclick="goToPage(' + (currentPage - 1) + ')">&laquo; Prev</button>';
                }
                html += '<span>Page ' + currentPage + ' of ' + totalPages +
                        ' (' + data.TotalCount + ' total)</span>';
                if (currentPage < totalPages) {
                    html += '<button class="btn btn-primary" onclick="goToPage(' + (currentPage + 1) + ')">Next &raquo;</button>';
                }
                if (totalPages > 2) {
                    html += ' <input type="number" id="jump-page-input" min="1" max="' + totalPages +
                             '" placeholder="Page #" style="width:5em;">' +
                             '<button class="btn btn-primary" onclick="jumpToPage(' + totalPages + ')">Go</button>';
                }
                container.innerHTML = html;
            }

            function jumpToPage(totalPages) {
                var input = document.getElementById('jump-page-input');
                var page = parseInt(input.value, 10);
                if (!page || page < 1 || page > totalPages) {
                    showError('Enter a page number between 1 and ' + totalPages + '.');
                    return;
                }
                goToPage(page);
            }

            function changePageSize() {
                pageSize = parseInt(document.getElementById('page-size-select').value, 10);
                currentPage = 1;
                loadResults();
            }

            function goToPage(page) {
                currentPage = page;
                loadResults();
            }

            function triggerScan(deep) {
                apiFetch('Scan', {
                    method: 'POST',
                    headers: {
                        'X-Emby-Token': ApiClient.accessToken(),
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ deepScan: deep })
                }).then(function() {
                    setTimeout(loadStatus, 1000);
                }).catch(function(err) {
                    if (err.message.indexOf('409') >= 0) {
                        showError('A scan is already in progress.');
                    } else {
                        showError('Failed to trigger scan: ' + err.message);
                    }
                });
            }

            function cancelScan() {
                apiFetch('Cancel', {
                    method: 'POST',
                    headers: {
                        'X-Emby-Token': ApiClient.accessToken()
                    }
                }).then(function() {
                    setTimeout(loadStatus, 1000);
                }).catch(function(err) {
                    showError('Failed to cancel scan: ' + err.message);
                });
            }

            function getStatusClass(status) {
                var classes = ['pending', 'pass', 'fail', 'fail'];
                return classes[status] || 'pending';
            }

            function getStatusLabel(status) {
                var labels = ['Pending', 'Pass', 'Fail', 'Error'];
                return labels[status] || 'Unknown';
            }

            function formatDate(iso) {
                if (!iso) return '—';
                try {
                    return new Date(iso).toLocaleString();
                } catch (e) {
                    return iso;
                }
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/&/g, '&amp;')
                          .replace(/</g, '&lt;')
                          .replace(/>/g, '&gt;')
                          .replace(/"/g, '&quot;');
            }

            function showError(msg) {
                var el = document.getElementById('error-msg');
                el.textContent = msg;
                el.style.display = 'block';
            }

            function hideError() {
                document.getElementById('error-msg').style.display = 'none';
            }

            var lastUpdateStatus = null;

            function loadUpdateStatus() {
                apiFetch('UpdateStatus').then(function(data) {
                    lastUpdateStatus = data;
                    document.getElementById('current-version').textContent = data.CurrentVersion;

                    var banner = document.getElementById('update-banner');
                    if (data.UpdateAvailable) {
                        document.getElementById('update-banner-text').textContent =
                            'Update available: v' + data.AvailableVersion + ' (' + data.Channel + ')';
                        document.getElementById('btn-update-now').style.display = '';
                        document.getElementById('btn-update-now').disabled = false;
                        banner.style.display = 'flex';
                    } else {
                        banner.style.display = 'none';
                    }
                }).catch(function(err) {
                    // Non-fatal: don't clobber the scan-operation error banner
                    // over an update check failing (e.g. no repository registered yet).
                    console.error('Failed to load update status: ' + err.message);
                });
            }

            function installUpdate() {
                if (!lastUpdateStatus) {
                    return;
                }

                var btn = document.getElementById('btn-update-now');
                btn.disabled = true;

                apiFetch('UpdateStatus/Install', {
                    method: 'POST',
                    headers: {
                        'X-Emby-Token': ApiClient.accessToken(),
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ channel: lastUpdateStatus.Channel })
                }).then(function() {
                    document.getElementById('update-banner-text').textContent =
                        'Update installed — restart Jellyfin to finish applying it.';
                    btn.style.display = 'none';
                }).catch(function(err) {
                    btn.disabled = false;
                    showError('Failed to install update: ' + err.message);
                });
            }

            // Initial load
            loadStatus();
            loadResults();
            loadUpdateStatus();

            // Auto-refresh status every 10 seconds
            refreshInterval = setInterval(loadStatus, 10000);
        </script>
    </div>
</div>
